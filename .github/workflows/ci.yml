name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, and Expo doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: active-pitch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: active-pitch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      # expo-env.d.ts is gitignored, so generate it before typechecking
      - name: Generate Expo types
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo doctor
        run: npx expo-doctor
